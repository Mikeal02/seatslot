name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Unit & integration tests (coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage (fails below thresholds)
        run: bun run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const rows = ['lines','statements','functions','branches']
                .map(k => \`| ${k} | \${s[k].pct}% |\`).join('\n');
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                '## Coverage\n\n| Metric | % |\n| --- | --- |\n' + rows + '\n');
            "
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
